<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario IA</title>
<link rel="stylesheet" href="estilo.css">
<link rel="alternate" type="application/rss+xml" title="Diario IA" href="feed.xml">
</head>
<body>
<div class="contenedor contenedor-ancho">

  <header class="cabecera">
    <span class="logo">Diario <span>IA</span></span>
    <div class="fecha-mono">Noticias de IA, todos los días</div>
  </header>

  <section class="banda">
    <div class="titulo-bloque titulo-banda">Ediciones</div>
    <div class="grilla">
      {% for e in ediciones %}
      <article class="panel tarjeta{% if loop.first %} tarjeta-principal{% endif %}">
        <div class="ed-fecha"><a href="ediciones/{{ e.fecha }}.html">{{ e.fecha_legible }}</a></div>
        {% if e.titulares %}<div class="ed-titulares">{{ e.titulares | join(' · ') }}</div>{% endif %}
        <div class="ed-total pie-item">{{ e.total }} items</div>
      </article>
      {% endfor %}
    </div>
  </section>

  <footer class="pie">
    Diario personal de noticias de IA, generado automáticamente · <a href="feed.xml">RSS</a>
  </footer>

</div>
</body>
</html>
